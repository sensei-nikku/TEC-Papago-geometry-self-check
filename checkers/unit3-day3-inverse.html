/* Right-triangle figure, drawn TO SCALE, orientation-agnostic.
   Canonical frame (math coords, y up):  W(0,0) - R(h,0) - N(h,v)
   R is the right angle. theta sits at W or N, set by cfg.vx.
   cfg.rot (0-3) rotates by 90 deg steps; cfg.flip mirrors first.
   Every label is placed from the geometry itself -- midpoint pushed out
   along the outward normal -- so no orientation needs special-casing.
   Colours are currentColor / var(--accent), so it follows light and dark. */
function figTri(cfg){
  var h=cfg.h, v=cfg.v, PAD=44, TARGET=150;
  var P=[[0,0],[h,0],[h,v]];                       // W, R, N
  if(cfg.flip) P=P.map(function(p){return [-p[0],p[1]];});
  for(var k=0;k<(cfg.rot||0);k++) P=P.map(function(p){return [-p[1],p[0]];});
  var s=TARGET/Math.max(h,v);
  P=P.map(function(p){return [p[0]*s,p[1]*s];});
  var xs=P.map(function(p){return p[0];}), ys=P.map(function(p){return p[1];});
  var minx=Math.min.apply(null,xs), maxy=Math.max.apply(null,ys);
  // to SVG coords (y down) with padding
  var Q=P.map(function(p){return [p[0]-minx+PAD, maxy-p[1]+PAD];});
  var W=Math.max.apply(null,Q.map(function(p){return p[0];}))+PAD;
  var H=Math.max.apply(null,Q.map(function(p){return p[1];}))+PAD;
  var C=[(Q[0][0]+Q[1][0]+Q[2][0])/3,(Q[0][1]+Q[1][1]+Q[2][1])/3];

  function sub(a,b){return [a[0]-b[0],a[1]-b[1]];}
  function unit(d){var n=Math.hypot(d[0],d[1])||1;return [d[0]/n,d[1]/n];}
  function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}

  var e='';
  e+='<polygon points="'+Q.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+
     '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>';

  // right-angle marker at R (index 1), built from the two leg directions
  var R=Q[1], u1=unit(sub(Q[0],R)), u2=unit(sub(Q[2],R)), m=11;
  e+='<path d="M '+(R[0]+u1[0]*m).toFixed(1)+' '+(R[1]+u1[1]*m).toFixed(1)+
     ' L '+(R[0]+(u1[0]+u2[0])*m).toFixed(1)+' '+(R[1]+(u1[1]+u2[1])*m).toFixed(1)+
     ' L '+(R[0]+u2[0]*m).toFixed(1)+' '+(R[1]+u2[1]*m).toFixed(1)+
     '" fill="none" stroke="currentColor" stroke-width="1.7"/>';

  // theta arc at its vertex, drawn as a polyline so no SVG sweep flag can be wrong
  var vi = (cfg.vx==='W') ? 0 : 2;
  var T=Q[vi], a1=unit(sub(Q[(vi+1)%3],T)), a2=unit(sub(Q[(vi+2)%3],T)), r=22;
  var th1=Math.atan2(a1[1],a1[0]), th2=Math.atan2(a2[1],a2[0]);
  var dth=th2-th1; while(dth>Math.PI)dth-=2*Math.PI; while(dth<-Math.PI)dth+=2*Math.PI;
  var arc=[];
  for(var i=0;i<=14;i++){var t=th1+dth*i/14;arc.push((T[0]+r*Math.cos(t)).toFixed(1)+','+(T[1]+r*Math.sin(t)).toFixed(1));}
  e+='<polyline points="'+arc.join(' ')+'" fill="none" stroke="var(--accent,#1B6B93)" stroke-width="2"/>';
  var bis=unit([a1[0]+a2[0],a1[1]+a2[1]]);
  e+='<text x="'+(T[0]+bis[0]*38).toFixed(1)+'" y="'+(T[1]+bis[1]*38+5).toFixed(1)+
     '" text-anchor="middle" font-size="16" font-style="italic" fill="var(--accent,#1B6B93)" '+
     'font-family="DM Sans, sans-serif">\u03B8</text>';

  // side labels: only the two the problem gives, pushed out along the outward normal
  function label(i,j,txt){
    var M=mid(Q[i],Q[j]), out=unit(sub(M,C));
    var x=M[0]+out[0]*26, y=M[1]+out[1]*26+5;
    var anc = out[0]>0.35?'start':(out[0]<-0.35?'end':'middle');
    return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+anc+
           '" font-size="14" fill="currentColor" font-family="DM Sans, sans-serif">'+txt+'</text>';
  }
  var OPP = (cfg.vx==='W') ? [1,2] : [0,1];   // side not touching theta
  var ADJ = (cfg.vx==='W') ? [0,1] : [1,2];   // leg touching theta
  var HYP = [0,2];
  if(cfg.pair==='OA'){ e+=label(OPP[0],OPP[1],'opp = '+cfg.top); e+=label(ADJ[0],ADJ[1],'adj = '+cfg.bot); }
  else if(cfg.pair==='OH'){ e+=label(OPP[0],OPP[1],'opp = '+cfg.top); e+=label(HYP[0],HYP[1],'hyp = '+cfg.bot); }
  else { e+=label(ADJ[0],ADJ[1],'adj = '+cfg.top); e+=label(HYP[0],HYP[1],'hyp = '+cfg.bot); }

  return '<svg class="figtri" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" width="'+Math.min(W,340).toFixed(0)+
    '" data-vi="'+vi+'" role="img" aria-label="Right triangle drawn to scale, two sides labelled, theta marked at one acute corner" '+
    'xmlns="http://www.w3.org/2000/svg">'+e+'</svg>';
}
