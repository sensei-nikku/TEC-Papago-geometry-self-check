/* Figure: right triangle drawn TO SCALE from the real legs, so the student can
   eyeball whether the angle they computed is plausible. Only the two sides the
   problem gives are labelled. Ported from the verified Day 3 build. */
function figTri(c){
  var opp=c.opp, adj=c.adj, pair=c.pair;
  var s=150/Math.max(opp,adj), legAdj=adj*s, legOpp=opp*s;
  var Lpad=95,Rpad=84,Tpad=22,Bpad=40;
  var W=legAdj+Lpad+Rpad, H=legOpp+Tpad+Bpad;
  var Ax=Lpad, Ay=H-Bpad, Bx=Lpad+legAdj, By=H-Bpad, Cx=Lpad+legAdj, Cy=H-Bpad-legOpp;
  var BLUE='#1B6B93', INK='#1A2332', e='';
  e+='<polygon points="'+Ax+','+Ay+' '+Bx+','+By+' '+Cx+','+Cy+'" fill="none" stroke="'+INK+'" stroke-width="2.2"/>';
  e+='<polyline points="'+(Bx-11)+','+By+' '+(Bx-11)+','+(By-11)+' '+Bx+','+(By-11)+'" fill="none" stroke="'+INK+'" stroke-width="1.6"/>';
  var ang=Math.atan2(legOpp,legAdj), r=20;
  e+='<path d="M '+(Ax+r)+' '+Ay+' A '+r+' '+r+' 0 0 0 '+(Ax+r*Math.cos(ang)).toFixed(1)+' '+(Ay-r*Math.sin(ang)).toFixed(1)+'" fill="none" stroke="'+BLUE+'" stroke-width="1.8"/>';
  e+='<text x="'+(Ax+26)+'" y="'+(Ay-9)+'" fill="'+BLUE+'" font-size="15" font-style="italic">\u03B8</text>';
  function t(x,y,str,a){return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" fill="'+INK+'" font-size="14" text-anchor="'+(a||'middle')+'">'+str+'</text>';}
  if(pair==='OH'){ e+=t(Bx+10,(By+Cy)/2+4,'opp = '+c.top,'start'); e+=t((Ax+Cx)/2-10,(Ay+Cy)/2-5,'hyp = '+c.bot,'end'); }
  else if(pair==='AH'){ e+=t((Ax+Bx)/2,By+22,'adj = '+c.top); e+=t((Ax+Cx)/2-10,(Ay+Cy)/2-5,'hyp = '+c.bot,'end'); }
  else { e+=t(Bx+10,(By+Cy)/2+4,'opp = '+c.top,'start'); e+=t((Ax+Bx)/2,By+22,'adj = '+c.bot); }
  return '<svg width="'+W.toFixed(0)+'" height="'+H.toFixed(0)+'" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" role="img" aria-label="Right triangle drawn to scale, two sides labelled" xmlns="http://www.w3.org/2000/svg">'+e+'</svg>';
}
